<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adopciones | Sigue mi Huella</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/tema.css" rel="stylesheet">
  <link href="../css/movimiento.css" rel="stylesheet">
  <link href="albergue.css" rel="stylesheet">
  <link rel="icon" href="../img/silueta.svg" type="image/svg+xml">
</head>
<body>
  <a class="btn btn-primary saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="menu-panel"></header>

  <main id="contenido" class="app">
    <div class="container">
      <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <h1 class="titulo-pantalla mb-1">Adopciones</h1>
          <p class="text-suave mb-0" id="resumen-adopciones">Todas las familias que acompañamos.</p>
        </div>
        <a class="btn btn-primary" href="nueva-adopcion.html"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva adopción</a>
      </header>

      <form class="card mb-4" role="search" id="form-filtros">
        <div class="card-body d-grid gap-3">
          <div>
            <label class="form-label" for="buscar">Buscar</label>
            <input class="form-control" type="search" id="buscar" placeholder="Perro, familia, distrito o código" autocomplete="off">
          </div>
          <fieldset>
            <legend class="form-label fs-6">Cómo va</legend>
            <div class="filtros-semaforo">
              <input type="radio" class="btn-check" name="filtro" id="f-todos" value="todos" checked>
              <label class="btn btn-outline-primary" for="f-todos">Todos</label>
              <input type="radio" class="btn-check" name="filtro" id="f-rojo" value="rojo">
              <label class="btn btn-outline-primary" for="f-rojo">Necesita llamada</label>
              <input type="radio" class="btn-check" name="filtro" id="f-ambar" value="ambar">
              <label class="btn btn-outline-primary" for="f-ambar">Hace tiempo</label>
              <input type="radio" class="btn-check" name="filtro" id="f-verde" value="verde">
              <label class="btn btn-outline-primary" for="f-verde">Todo bien</label>
            </div>
          </fieldset>
        </div>
      </form>

      <p class="visually-hidden" id="conteo" aria-live="polite"></p>
      <section aria-labelledby="t-activas" class="mb-5">
        <h2 id="t-activas" class="h3 mb-3">Adopciones activas</h2>
        <ul class="list-unstyled d-grid gap-2 mb-0" id="activas">
          <li class="placeholder-carga" style="height: 96px"></li>
        </ul>
      </section>

      <section aria-labelledby="t-terminadas" id="seccion-terminadas" hidden>
        <h2 id="t-terminadas" class="h3 mb-1">Adopciones devueltas o cerradas</h2>
        <p class="text-suave">Se conservan para consultar su historial.</p>
        <ul class="list-unstyled d-grid gap-2 mb-0" id="terminadas"></ul>
      </section>
    </div>
  </main>

  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="adopciones.js"></script>
</body>
</html>
