<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perros del albergue | Sigue mi Huella</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/tema.css" rel="stylesheet">
  <link href="../css/movimiento.css" rel="stylesheet">
  <link href="albergue.css" rel="stylesheet">
  <link rel="icon" href="../img/silueta.svg" type="image/svg+xml">
</head>
<body>
  <a class="btn btn-primary saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="menu-panel"></header>

  <main id="contenido" class="app">
    <div class="container">
      <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <h1 class="titulo-pantalla mb-1">Perros del albergue</h1>
          <p class="text-suave mb-0">El catálogo completo. Los perros que están buscando hogar aparecen en la página pública.</p>
        </div>
        <button class="btn btn-primary" type="button" id="btn-nuevo"><i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar perro</button>
      </header>

      <div class="row g-3 align-items-end mb-4">
        <div class="col-sm-6 col-lg-4">
          <label class="form-label" for="filtro-estado">Mostrar</label>
          <select class="form-select" id="filtro-estado">
            <option value="">Todos los perros</option>
            <option value="en_albergue">En el albergue</option>
            <option value="en_adopcion">Buscando hogar</option>
            <option value="adoptado">Adoptados</option>
            <option value="devuelto">Devueltos</option>
            <option value="fallecido">Fallecidos</option>
          </select>
        </div>
        <div class="col-sm-6 col-lg-4">
          <label class="form-label" for="buscar-perro">Buscar</label>
          <input class="form-control" type="search" id="buscar-perro" placeholder="Nombre o código" autocomplete="off">
        </div>
        <p class="col-lg-4 text-suave mb-0" id="conteo-perros" aria-live="polite"></p>
      </div>

      <ul class="row g-3 list-unstyled mb-0" id="perros">
        <li class="col-12"><div class="placeholder-carga" style="height: 220px"></div></li>
      </ul>
    </div>
  </main>

  <!-- Alta y edicion -->
  <div class="modal fade" id="modal-perro" tabindex="-1" aria-labelledby="modal-perro-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
      <form class="modal-content" id="form-perro" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h4" id="modal-perro-titulo">Agregar perro</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 d-flex flex-wrap gap-3 align-items-center">
              <img id="vista-foto" class="foto-redonda" src="../img/sin-foto.svg" alt="Vista previa de la foto" width="112" height="112">
              <div class="flex-grow-1">
                <label class="form-label" for="perro-foto">Foto principal</label>
                <input class="form-control" type="file" id="perro-foto" accept="image/jpeg,image/png,image/webp">
                <p class="small text-suave mb-0 mt-1">Se reduce automáticamente antes de subirla.</p>
              </div>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="perro-codigo">Código</label>
              <input class="form-control" id="perro-codigo" required maxlength="20" autocomplete="off">
            </div>
            <div class="col-sm-8">
              <label class="form-label" for="perro-nombre">Nombre</label>
              <input class="form-control" id="perro-nombre" required maxlength="60" autocomplete="off">
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="perro-sexo">Sexo</label>
              <select class="form-select" id="perro-sexo" required>
                <option value="hembra">Hembra</option>
                <option value="macho">Macho</option>
              </select>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="perro-tamano">Tamaño</label>
              <select class="form-select" id="perro-tamano" required>
                <option value="pequeno">Pequeño</option>
                <option value="mediano" selected>Mediano</option>
                <option value="grande">Grande</option>
              </select>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="perro-estado">Estado</label>
              <select class="form-select" id="perro-estado" required>
                <option value="en_albergue">En el albergue</option>
                <option value="en_adopcion">Buscando hogar</option>
                <option value="adoptado">Adoptado</option>
                <option value="devuelto">Devuelto</option>
                <option value="fallecido">Fallecido</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="perro-nacimiento">Fecha aproximada de nacimiento</label>
              <input class="form-control" type="date" id="perro-nacimiento">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="perro-rescate">Fecha de rescate</label>
              <input class="form-control" type="date" id="perro-rescate">
            </div>
            <div class="col-12">
              <label class="form-label" for="perro-historia">Historia del rescate</label>
              <textarea class="form-control" id="perro-historia" maxlength="1200" rows="4"></textarea>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="perro-esterilizado">
                <label class="form-check-label" for="perro-esterilizado">Está esterilizado</label>
              </div>
            </div>
          </div>
          <div class="alert alert-warning mt-3 mb-0" id="perro-error" role="alert" hidden></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-suave" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar-perro"><i class="bi bi-check2" aria-hidden="true"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="perros.js"></script>
</body>
</html>
